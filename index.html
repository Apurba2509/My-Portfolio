<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title, description, social cards and structured data come from scripts/seo.js -->
    <!--seo-->
    <link rel="preload" as="image" href="/img/apurba-das-480.webp" type="image/webp" />
    <script>
      // Before the first paint: skip the loader for repeat visits and reduced motion,
      // otherwise hold the page still while it plays.
      try {
        var skip = sessionStorage.getItem("apurba:intro-seen") === "1" || matchMedia("(prefers-reduced-motion: reduce)").matches;
        document.documentElement.classList.add(skip ? "skip-intro" : "is-loading");
      } catch (e) {}
    </script>
    <noscript><style>[data-preloader] { display: none !important; }</style></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
